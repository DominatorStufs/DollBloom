name: Android Release Build
run-name: DollBloom ${{ inputs.version_name || inputs.version_code || github.ref_name }} (#${{ inputs.version_code || github.run_number }})

on:
  # A push builds and uploads the APK as an artifact, so a change is never
  # merged on the strength of "it looks fine". Only a dispatch publishes a
  # release, because a release is a decision and a push is not.
  push:
    branches:
      - master
      - 'arena/**'
  workflow_dispatch:
    inputs:
      # Both of these are optional on purpose. Pressing Run with the form empty
      # is a legitimate request -- "build the app the way a push would" -- and a
      # form that will not start until two boxes are filled turns a simple thing
      # into a chore.
      version_code:
        description: "Optional. Leave empty and the build numbers itself from the date. Fill it in (a number above the build on the phone) to make this a versioned release."
        required: false
        default: ""
        type: string
      version_name:
        description: "Optional, and letters are fine: 1.8, 1.8-beta2, spring-release. Leave both boxes empty for a rolling build on the 'latest' pre-release."
        required: false
        default: ""
        type: string
      signing_passphrase:
        description: "Passphrase for the release signing key. Leave empty: the workflow already has it, and a secret here only overrides it."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

# A branch that is pushed twice in a minute should build once. A dispatched
# release is left alone — two of those are two decisions, and the second one
# arriving is not a reason to cancel the APK the first is in the middle of
# publishing.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-prod-release:
    name: Build the production universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # This installs Android command-line tools and puts sdkmanager on PATH.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK API 37 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root is missing after setup-android."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found. The setup-android step did not install command-line tools."
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          "$SDKMANAGER" --channel=3 --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          PLATFORM_37="$SDK_ROOT/platforms/android-37.0"
          if [[ ! -f "$PLATFORM_37/android.jar" ]]; then
            echo "::error::Android SDK API 37.0 did not install correctly (android.jar is missing)."
            exit 1
          fi

          # AGP resolves compileSdk=37 through platforms/android-37. Use a real
          # directory alias (hard-linked files), not a symlink; the symlink form
          # was not resolved by Gradle on this project.
          PLATFORM_37_ALIAS="$SDK_ROOT/platforms/android-37"
          if [[ -L "$PLATFORM_37_ALIAS" ]]; then
            rm -f "$PLATFORM_37_ALIAS"
          fi
          if [[ ! -f "$PLATFORM_37_ALIAS/android.jar" ]]; then
            if [[ -e "$PLATFORM_37_ALIAS" ]]; then
              echo "::error::Unexpected existing SDK path without android.jar: $PLATFORM_37_ALIAS"
              exit 1
            fi
            cp -al "$PLATFORM_37" "$PLATFORM_37_ALIAS"
          fi

      # One place decides what this build is. Everything below reads the result
      # from the environment rather than deciding again, so a build cannot be
      # released under one version and named as another.
      #
      # Nothing has to be typed. A dispatch with both boxes empty does what a
      # push does: the date for a version code, a nightly name, and the rolling
      # pre-release at the end of it. Fill in either box and the same run becomes
      # a versioned release instead, under whatever name was given -- letters and
      # all, which is what makes "1.8-beta2" a version name. That is the whole
      # difference between the two kinds of build.
      - name: Decide the version
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail

          # A push arrives with no inputs at all, and so does a dispatch whose
          # form was left alone. Those are the same request.
          APP_VERSION_CODE=""
          APP_VERSION_NAME=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            APP_VERSION_CODE="$INPUT_VERSION_CODE"
            APP_VERSION_NAME="$INPUT_VERSION_NAME"
          fi

          if [[ -n "$APP_VERSION_CODE" || -n "$APP_VERSION_NAME" ]]; then
            APP_PUBLISH="versioned"
          else
            APP_PUBLISH="rolling"
          fi

          if [[ -z "$APP_VERSION_CODE" ]]; then
            # Android refuses to install a build whose code is below the
            # installed one's, so a build nobody numbered is numbered by the
            # date: 20261008 is above every code this project has shipped, and
            # tomorrow's is above today's. Two builds in a day share a code,
            # which is correct -- they are the same version, and the second is a
            # correction to it.
            APP_VERSION_CODE="$(date -u +%Y%m%d)"
          fi
          if [[ -z "$APP_VERSION_NAME" ]]; then
            if [[ "$APP_PUBLISH" == "versioned" ]]; then
              # A code was given and a name was not, so the name is the code. It
              # makes the release tag something rather than nothing.
              APP_VERSION_NAME="$APP_VERSION_CODE"
            else
              APP_VERSION_NAME="nightly.${APP_VERSION_CODE}"
            fi
          fi

          if [[ ! "$APP_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::Version code must be a positive whole number without leading zeroes."
            exit 1
          fi
          if (( 10#$APP_VERSION_CODE > 2100000000 )); then
            echo "::error::Version code must not exceed Android's 2100000000 limit."
            exit 1
          fi
          VERSION_NAME_PATTERN='^[A-Za-z0-9][A-Za-z0-9 ._+-]*$'
          if [[ ${#APP_VERSION_NAME} -gt 64 || ! "$APP_VERSION_NAME" =~ $VERSION_NAME_PATTERN ]]; then
            echo "::error::Version name must be 1-64 characters, start with a letter or number, and contain only letters, numbers, spaces, dots, underscores, pluses, or hyphens."
            exit 1
          fi

          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_PUBLISH=$APP_PUBLISH" >> "$GITHUB_ENV"
          echo "::notice::Building $APP_VERSION_NAME (version code $APP_VERSION_CODE), publishing: $APP_PUBLISH"

      # The Last.fm pair arrives from *repository secrets* only — never from an
      # environment binding, and never written when incomplete: an empty
      # `LASTFM_API_KEY=` line here is exactly what used to hide a valid value
      # from the build's fallback and ship an APK whose login said "API
      # credentials are not configured". The writer script validates the pair,
      # escapes it for Java Properties, diagnoses credentials that were filed
      # under Variables instead of Secrets (presence checks only — values are
      # never printed), and keeps the optional LASTFM_REQUIRED=true enforcement
      # and the Listen Together default. See scripts/write-lastfm-settings.py.
      - name: Write local build settings
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Booleans for the misplaced-credentials diagnostic only: non-empty
          # here with empty secrets above means the pair is on the Variables tab.
          LASTFM_API_KEY_VARIABLE: ${{ vars.LASTFM_API_KEY }}
          LASTFM_SECRET_VARIABLE: ${{ vars.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER }}
          LASTFM_REQUIRED: ${{ vars.LASTFM_REQUIRED }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/write-lastfm-settings.py --out local.properties

      # Generates a throwaway key in a scratch directory and unseals it, which is
      # the same code path the release key takes one step below — openssl
      # encrypting and decrypting, keytool reading the result, the passphrase
      # derivation on both sides. It exists because the real key cannot be tested
      # by anything that does not have its passphrase, and a signing tool that
      # has never been run is a signing tool that is about to fail in the middle
      # of a release. Seconds to run, and it touches nothing outside $RUNNER_TEMP.
      - name: Self-test the signing tool on a throwaway key
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="$RUNNER_TEMP/signing-selftest"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"
          SELFTEST_PASSPHRASE="self-test-$(date +%s)-throwaway"

          echo "::add-mask::$SELFTEST_PASSPHRASE"
          export DOLLBLOOM_SIGNING_PASSPHRASE="$SELFTEST_PASSPHRASE"

          python3 signing/dollbloom_signing.py --repo-root "$SCRATCH" \
            init --new-passphrase "$DOLLBLOOM_SIGNING_PASSPHRASE"
          python3 signing/dollbloom_signing.py --repo-root "$SCRATCH" \
            --passphrase-env DOLLBLOOM_SIGNING_PASSPHRASE verify
          python3 signing/dollbloom_signing.py --repo-root "$SCRATCH" \
            --passphrase-env DOLLBLOOM_SIGNING_PASSPHRASE unseal --out-dir "$SCRATCH"

          # The unsealed store has to hold a usable private key, not merely exist:
          # signing a certificate request is the cheapest real use of one.
          keytool -certreq -keystore "$SCRATCH/dollbloom-release.jks" \
            -storetype JKS -alias dollbloom \
            -storepass:env DOLLBLOOM_SIGNING_PASSPHRASE \
            -keypass:env DOLLBLOOM_SIGNING_PASSPHRASE \
            -file "$SCRATCH/selftest.csr"

          # And a wrong passphrase has to be refused rather than merely failing
          # later, at the keystore.
          if DOLLBLOOM_SIGNING_PASSPHRASE="not-the-passphrase" \
            python3 signing/dollbloom_signing.py --repo-root "$SCRATCH" \
              --passphrase-env DOLLBLOOM_SIGNING_PASSPHRASE verify 2>/dev/null; then
            echo "::error::A wrong passphrase was accepted."
            exit 1
          fi

          rm -rf "$SCRATCH"
          echo "::notice::signing tool self-test passed (unseal, keytool, and rejection of a wrong passphrase)"

      # The key is in the repository, encrypted, and this is the only step that
      # ever holds it in the clear. It is written to disk here, used by the build
      # below, and is not uploaded, cached, or logged — see signing/README.md.
      #
      # The passphrase is looked for in four places, in this order, because the
      # four differ in how well they can be kept quiet — and the last one is the
      # one that is always there, which is what makes a build automatic:
      #
      #   1. the DOLLBLOOM_SIGNING_PASSPHRASE secret — masked everywhere on
      #      GitHub, including this run's own summary page. Best.
      #   2. the DOLLBLOOM_SIGNING_PASSPHRASE variable — set once. If it exists it
      #      also replaces the built-in below, which is the lever for taking the
      #      password back out of this file without editing it.
      #   3. the signing_passphrase input — typed when the workflow is started,
      #      by hand or by the app. Masked in the log below, but the run page
      #      shows a dispatch's inputs, so treat it as the least private of the
      #      four. A wrong one here fails the run rather than falling through, so
      #      a typo is never mistaken for the built-in.
      #   4. SIGNING_PASSPHRASE_BUILTIN, set on this step below — the passphrase,
      #      in the repository. Read the note on it there.
      - name: Unseal the release signing key
        id: signing
        env:
          SIGNING_PASSPHRASE_SECRET: ${{ secrets.DOLLBLOOM_SIGNING_PASSPHRASE }}
          SIGNING_PASSPHRASE_VARIABLE: ${{ vars.DOLLBLOOM_SIGNING_PASSPHRASE }}
          SIGNING_PASSPHRASE_INPUT: ${{ inputs.signing_passphrase }}
          # The passphrase, in the place the build can always reach it. This is
          # what lets the action unlock the lock file in signing/ on its own:
          # a push has nobody to ask, and a dispatch should not have to carry a
          # password that the repository already knows.
          #
          # Being here means being readable by anyone who can read this file,
          # which is the whole of what it costs. It is not less private for
          # being built in — the alternatives (an Actions secret, a variable)
          # are all reachable by the same person reading the same repository.
          # What it buys is a signed APK from every push with nobody in the
          # loop. Delete this one line to go back to a passphrase that has to be
          # supplied before anything can be signed.
          SIGNING_PASSPHRASE_BUILTIN: ${{ vars.DOLLBLOOM_SIGNING_PASSPHRASE || 'DollBloom#Sakura-2026' }}
        shell: bash
        run: |
          set -euo pipefail

          PASSPHRASE="${SIGNING_PASSPHRASE_SECRET:-${SIGNING_PASSPHRASE_VARIABLE:-${SIGNING_PASSPHRASE_INPUT:-$SIGNING_PASSPHRASE_BUILTIN}}}"
          if [[ -z "$PASSPHRASE" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              # A push has no way to be given a passphrase, and its job is to
              # prove the tree builds. The APK it uploads is unsigned and says
              # so in its name; nothing is published.
              echo "::notice::No signing passphrase is configured, so this build stops short of signing. The built-in passphrase seems to have been removed from this workflow: put it back, or set the DOLLBLOOM_SIGNING_PASSPHRASE secret or variable, to sign builds made from a push."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No signing passphrase. Set the DOLLBLOOM_SIGNING_PASSPHRASE secret (Settings > Secrets and variables > Actions), or type one into the signing_passphrase box when dispatching this workflow. Without it the release signing key cannot be unsealed and there is nothing to sign a build with."
            exit 1
          fi

          # Keeps it out of every later line of this job's log. Cheap, and the
          # alternative is a passphrase pasted into a bug report.
          echo "::add-mask::$PASSPHRASE"

          export DOLLBLOOM_SIGNING_PASSPHRASE="$PASSPHRASE"
          python3 signing/dollbloom_signing.py \
            --passphrase-env DOLLBLOOM_SIGNING_PASSPHRASE \
            unseal --out-dir .

          # AGP would fail on a keystore it cannot read, but this says so in the
          # log with the key's own name rather than as a wall of task output.
          #
          # keytool's :env password modifier is the clean way to hand it a
          # password — nothing lands in the process list — and it has been in
          # every JDK this project builds with. The direct form is a fallback
          # for a JDK that does not take the modifier, because failing here
          # would fail a release over a syntax detail.
          CERTREQ=(keytool -certreq -keystore dollbloom-release.jks
            -storetype JKS -alias dollbloom
            -file "$RUNNER_TEMP/dollbloom-signing-check.csr")
          if ! "${CERTREQ[@]}" \
            -storepass:env DOLLBLOOM_SIGNING_PASSPHRASE \
            -keypass:env DOLLBLOOM_SIGNING_PASSPHRASE >/dev/null 2>&1; then
            "${CERTREQ[@]}" -storepass "$PASSPHRASE" -keypass "$PASSPHRASE" >/dev/null
          fi
          rm -f "$RUNNER_TEMP/dollbloom-signing-check.csr"

          echo "::notice::Release signing key unsealed and usable."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build production release APK
        run: |
          set -o pipefail
          ./gradlew assembleProdRelease \
            "-PappVersionCode=$APP_VERSION_CODE" \
            "-PappVersionName=$APP_VERSION_NAME" 2>&1 | tee gradle-build.log

      # A build log is the only place a compiler error is written down, and
      # GitHub's log download is not reachable from everywhere. Writing the tail
      # of it into the repository puts it wherever the tree can be cloned, which
      # is what makes a red build diagnosable rather than merely visible.
      #
      # Forced onto its own branch with [skip ci] so this can never trigger
      # another run, and so it never lands in anyone's checkout.
      - name: Publish the build log when the build fails
        if: failure()
        shell: bash
        run: |
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo
            tail -n 400 gradle-build.log 2>/dev/null || echo "no gradle-build.log was written"
          } > ci-build-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diagnostics
          git add -f ci-build-log.txt
          git commit -m "CI failure log for run ${GITHUB_RUN_ID} [skip ci]"
          git push --force origin ci-diagnostics || true

      - name: Verify universal APK size (maximum 100 MB)
        id: verify-size
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="app/build/outputs/apk/prod/release"
          mapfile -t UNIVERSAL_APKS < <(find "$OUTPUT_DIR" -type f -name '*universal*.apk' -print | sort)
          mapfile -t ARMV7_APKS < <(find "$OUTPUT_DIR" -type f -name '*armeabi-v7a*.apk' -print | sort)
          mapfile -t ARM64_APKS < <(find "$OUTPUT_DIR" -type f -name '*arm64-v8a*.apk' -print | sort)
          if (( ${#UNIVERSAL_APKS[@]} != 1 || ${#ARMV7_APKS[@]} != 1 || ${#ARM64_APKS[@]} != 1 )); then
            echo "::error::Expected exactly one universal, armeabi-v7a, and arm64-v8a phone APK."
            find "$OUTPUT_DIR" -type f -name '*.apk' -print | sort
            exit 1
          fi

          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            APK_NAME="DollBloom-prod-release-universal.apk"
            ARMV7_NAME="DollBloom-prod-release-armv7.apk"
            ARM64_NAME="DollBloom-prod-release-arm64.apk"
          else
            APK_NAME="DollBloom-prod-release-universal-unsigned.apk"
            ARMV7_NAME="DollBloom-prod-release-armv7-unsigned.apk"
            ARM64_NAME="DollBloom-prod-release-arm64-unsigned.apk"
          fi
          mkdir -p universal-artifact
          cp "${UNIVERSAL_APKS[0]}" "universal-artifact/$APK_NAME"
          cp "${ARMV7_APKS[0]}" "universal-artifact/$ARMV7_NAME"
          cp "${ARM64_APKS[0]}" "universal-artifact/$ARM64_NAME"
          APK_BYTES=$(stat -c '%s' "universal-artifact/$APK_NAME")
          APK_MB=$(awk -v bytes="$APK_BYTES" 'BEGIN { printf "%.2f", bytes / 1000000 }')
          echo "::notice::Universal APK size: ${APK_MB} MB (decimal)."
          if (( APK_BYTES > 100000000 )); then
            echo "::error::The universal APK is ${APK_MB} MB, over the 100 MB limit; refusing to publish it."
            exit 1
          fi
          echo "apk_path=universal-artifact/$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh universal-artifact/*.apk

      # "Signed" is a claim until something reads the signature back. The whole
      # point of this key is that an installed DollBloom accepts the next build
      # as an update, and the only way to know that is to look at the file that
      # gets published. apksigner does — it verifies every signature scheme the
      # APK carries — and the signer's fingerprint is then compared with the one
      # recorded in signing/keycheck.json. A build signed with a different key
      # fails here, in the run, instead of on somebody's phone as "app not
      # installed". The MD5 line below is what Play and adb show for this key,
      # and it is worth having in the run's summary.
      - name: Verify the APK is signed by the release key
        if: ${{ steps.signing.outputs.signed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="${{ steps.verify-size.outputs.apk_path }}"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "::error::There is no APK at $APK_FILE to verify."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(command -v apksigner || true)"
          if [[ -z "$APKSIGNER" && -n "$SDK_ROOT" ]]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found, so the APK's signature cannot be checked. It ships with build-tools, which this workflow installs."
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"

          # --print-certs also verifies: a signature that does not verify exits
          # non-zero, and the run stops before anything is published. Both
          # streams go into the report, because which one carries the
          # certificates is a detail of the build-tools version.
          CERT_REPORT="$RUNNER_TEMP/apksigner-report.txt"
          set +e
          "$APKSIGNER" verify --print-certs "$APK_FILE" > "$CERT_REPORT" 2>&1
          APKSIGNER_STATUS=$?
          set -e
          cat "$CERT_REPORT"
          if (( APKSIGNER_STATUS != 0 )); then
            echo "::error::apksigner rejected $APK_FILE: its signatures do not verify (exit $APKSIGNER_STATUS)."
            exit 1
          fi

          # Deliberately unanchored and loose about spacing, because the shape
          # of this report belongs to whichever build-tools version is
          # installed: build-tools 36 writes "V2 Signer: certificate SHA-256
          # digest: ..." where older ones wrote "Signer #1 certificate SHA-256
          # digest: ...". Requiring "certificate" is what keeps this off the
          # public key digests, which are also SHA-256 and are not the ones that
          # decide whether an update installs.
          DIGEST_LINE="$(grep -iE 'signer.*certificate[[:space:]]+sha-?256[[:space:]]+digest' "$CERT_REPORT" | head -1 || true)"
          ACTUAL="$(printf '%s' "$DIGEST_LINE" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
          if [[ -z "$ACTUAL" ]]; then
            # Print what apksigner actually said, line by line, so the run page
            # carries the reason rather than requiring the raw log.
            while IFS= read -r LINE; do
              [[ -n "$LINE" ]] && echo "::error::apksigner said: $LINE"
            done < "$CERT_REPORT"
            echo "::error::No signer certificate could be read out of apksigner's report for $APK_FILE."
            exit 1
          fi

          EXPECTED="$(python3 -c "import json; print(json.load(open('signing/keycheck.json'))['certificate_sha256'])" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::The APK is signed, but not with DollBloom's release key. Expected SHA-256 $EXPECTED, found $ACTUAL. Do not publish this build."
            exit 1
          fi

          SIGNER="$(grep -iE 'signer.*certificate[[:space:]]+dn[[:space:]]*:' "$CERT_REPORT" | head -1 | sed -E 's/.*[Dd][Nn][[:space:]]*:[[:space:]]*//' || true)"
          echo "::notice::APK signature verified. Signed by: ${SIGNER:-unknown}. SHA-256 $ACTUAL"

      - name: Upload phone APKs as a workflow artifact
        # GitHub artifact storage can be temporarily full. The signed APKs are
        # also published directly on the rolling release below, so quota must
        # not prevent that direct-download path from running.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dollbloom-prod-phone-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}
          path: universal-artifact/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create or update GitHub Release and replace its APK
        if: ${{ env.APP_PUBLISH == 'versioned' && steps.signing.outputs.signed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="universal-artifact/DollBloom-prod-release-universal.apk"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "::error::The signed universal APK is missing."
            exit 1
          fi

          # Reuse a release for the same version name. Prefer lowercase v-tags,
          # but recognize existing uppercase V-tags and unprefixed tags too.
          TAG_VERSION="$(printf '%s' "$APP_VERSION_NAME" | tr ' ' '-' | sed -E 's/\.\.+/./g; s/\.$//')"
          if [[ -z "$TAG_VERSION" ]]; then
            echo "::error::The version name cannot produce a valid release tag."
            exit 1
          fi
          RELEASE_TITLE="DollBloom ${APP_VERSION_NAME}"
          RELEASE_NOTES="$(printf 'DollBloom production release.\n\nVersion name: %s\nVersion code: %s\nSigning key: signing/dollbloom-cert.pem, valid until 2056-09-30\n\nThe signed universal APK is attached below. Re-running with the same version name updates this release and replaces the APK asset.\n' "$APP_VERSION_NAME" "$APP_VERSION_CODE")"
          RELEASE_TAG=""
          for CANDIDATE_TAG in "v${TAG_VERSION}" "V${TAG_VERSION}" "$TAG_VERSION"; do
            if git check-ref-format "refs/tags/${CANDIDATE_TAG}" && \
              gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              RELEASE_TAG="$CANDIDATE_TAG"
              break
            fi
          done

          if [[ -n "$RELEASE_TAG" ]]; then
            echo "::notice::Release ${RELEASE_TAG} already exists; updating it."
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          else
            RELEASE_TAG="v${TAG_VERSION}"
            if ! git check-ref-format "refs/tags/${RELEASE_TAG}"; then
              echo "::error::Generated release tag is invalid: ${RELEASE_TAG}"
              exit 1
            fi
            echo "::notice::Creating release ${RELEASE_TAG}."
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

          # --clobber replaces the asset with the same filename on an existing release.
          gh release upload "$RELEASE_TAG" "$APK_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # A push cannot be asked what to call itself, and inventing a tag per push
      # would fill the Releases page with builds nobody asked for. So it goes to
      # one rolling pre-release with a stable asset name and a stable URL:
      #
      #   https://github.com/DominatorStufs/DollBloom/releases/download/latest/DollBloom-latest.apk
      #
      # Pre-release on purpose. GitHub's "latest release" — which is what the
      # app's own update check reads — skips pre-releases, so a nightly never
      # turns into an update prompt on somebody's phone; installing one is a
      # deliberate act, done by whoever opens that URL.
      - name: Publish the rolling build that a push produces
        if: ${{ env.APP_PUBLISH == 'rolling' && steps.signing.outputs.signed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="universal-artifact/DollBloom-prod-release-universal.apk"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "::error::The signed universal APK is missing."
            exit 1
          fi

          NIGHTLY_ASSET="DollBloom-latest.apk"
          ARMV7_ASSET="DollBloom-latest-armv7.apk"
          ARM64_ASSET="DollBloom-latest-arm64.apk"
          cp "$APK_FILE" "universal-artifact/$NIGHTLY_ASSET"
          cp "universal-artifact/DollBloom-prod-release-armv7.apk" "universal-artifact/$ARMV7_ASSET"
          cp "universal-artifact/DollBloom-prod-release-arm64.apk" "universal-artifact/$ARM64_ASSET"
          NOTES="$(printf 'Signed phone build of %s.\n\nVersion name: %s\nVersion code: %s\nCommit: %s\n\nChoose the universal APK if unsure. arm64 is for modern 64-bit ARM phones; armv7 is for older 32-bit ARM phones. This app does not ship BitChord desktop, Linux, macOS, Windows, TV, or x86_64 targets.\n\nThe signing certificate is signing/dollbloom-cert.pem; its SHA-256 is printed on the Release signing key screen inside the app.\n' "$GITHUB_REF_NAME" "$APP_VERSION_NAME" "$APP_VERSION_CODE" "$GITHUB_SHA")"

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "DollBloom (latest build)" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DollBloom (latest build)" \
              --notes "$NOTES" \
              --prerelease
          fi

          gh release upload latest \
            "universal-artifact/$NIGHTLY_ASSET" \
            "universal-artifact/$ARMV7_ASSET" \
            "universal-artifact/$ARM64_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "::notice::Published universal, armv7, and arm64 phone APKs as version $APP_VERSION_NAME ($APP_VERSION_CODE)."

  # The build job proves the tree compiles and signs; this one proves the
  # Last.fm credential plumbing behaves. Both run on every push, side by side.
  #
  # The Python half needs nothing but a runner. The Gradle half runs only the
  # LastfmCredentials test class on the JVM — not the device suites, not an
  # APK — so it needs the SDK for AGP configuration but never cmake, the NDK,
  # or a signing key. Focused on purpose: these are the rules that decide
  # which application pair the app signs Last.fm requests with, and a
  # regression there reads to a listener as "my password is wrong".
  test-lastfm-credentials:
    name: Test the Last.fm credential plumbing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the local-settings writer
        run: python3 -m unittest discover -s scripts/tests -p 'test_lastfm_settings.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK platform (for AGP configuration only)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            # ubuntu-latest ships the SDK preinstalled and its root in one of
            # these two variables; if neither is set there is nothing to add to.
            echo "::error::Android SDK root is missing."
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [[ -n "$SDKMANAGER" && -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
              "platforms;android-37.0" \
              "build-tools;36.0.0" \
              "platform-tools"
          fi

          # Same alias the build job makes: AGP resolves compileSdk=37 through
          # platforms/android-37, and the hard-link copy is the form Gradle
          # resolves on this project.
          PLATFORM_37="$SDK_ROOT/platforms/android-37.0"
          PLATFORM_37_ALIAS="$SDK_ROOT/platforms/android-37"
          if [[ -d "$PLATFORM_37" && ! -f "$PLATFORM_37_ALIAS/android.jar" ]]; then
            if [[ -L "$PLATFORM_37_ALIAS" ]]; then rm -f "$PLATFORM_37_ALIAS"; fi
            if [[ -e "$PLATFORM_37_ALIAS" ]]; then
              echo "::error::Unexpected existing SDK path without android.jar: $PLATFORM_37_ALIAS"
              exit 1
            fi
            cp -al "$PLATFORM_37" "$PLATFORM_37_ALIAS"
          fi

      - name: Run the Last.fm credentials unit tests
        id: lastfm_tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testProdReleaseUnitTest --tests com.doll.bloom.LastfmCredentialsTest 2>&1 | tee gradle-lastfm-tests.log

      # A failure here is usually a compile or test error whose details the
      # reviewer needs. Post the telling lines to the open pull request for
      # this branch, if there is one, so they don't have to be dug out of
      # the run log. Runs only when the step above actually failed.
      - name: Post failure details to the pull request
        if: ${{ failure() && steps.lastfm_tests.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open pull request for $GITHUB_REF_NAME; nothing to annotate."
            exit 0
          fi
          DETAILS="$(grep -aE "e: |error:|FAILED|BUILD FAILED" gradle-lastfm-tests.log | tail -c 3000 || true)"
          if [[ -z "$DETAILS" ]]; then
            DETAILS="$(tail -c 3000 gradle-lastfm-tests.log)"
          fi
          {
            printf '❌ `test-lastfm-credentials` failed on run %s (attempt %s). The telling lines of the Gradle output:\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            echo '```'
            printf '%s\n' "$DETAILS"
            echo '```'
            printf '\nFull log: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > failure-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file failure-comment.md
