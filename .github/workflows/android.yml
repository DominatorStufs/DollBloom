name: Android CI

# Manual only, on purpose: nothing here runs on push or pull request.
# Start it from Actions -> "Android CI" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Write local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Unlock signing key from signing/release.lock (committed; no secrets needed)
      run: bash unlock-signing.sh

    - name: Verify this is the pinned DollBloom release key
      run: |
        # Every build — today's and every future feature update — must be
        # signed with the one DollBloom release key, or an update will not
        # install over an existing install. If the secret is ever swapped,
        # this fails the build instead of shipping a differently-signed APK.
        EXPECTED="B2:E4:39:33:74:68:B6:50:4D:36:36:C0:0E:08:C8:BB:ED:30:7B:A2:25:D3:A9:54:E4:1D:2B:74:4F:B7:37:3B"
        ACTUAL=$(keytool -list -keystore dollbloom-release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          | grep "SHA-256" | sed 's/.*SHA-256): //' | tr 'a-f' 'A-F')
        echo "Keystore SHA-256: $ACTUAL"
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::Signing key mismatch — refusing to build with a different key than shipped releases."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Unit tests
      run: ./gradlew :shared:jvmTest :app:testProdReleaseUnitTest

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dollbloom-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
