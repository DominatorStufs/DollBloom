name: Release

# Manual only: a release is cut by hand from Actions -> "Release" ->
# "Run workflow", filling in the two inputs below. No tag push, no commit,
# no pull request can trigger it.
#
#   version       -> the versionName stamped into the APK and the release
#                    title. Letters, digits, dashes, dots: anything goes
#                    ("2.0", "2.0-beta1", "dollbloom3" all fine).
#   version-code  -> the integer versionCode Android uses to decide which
#                    install is newer. Android itself only accepts a whole
#                    number here, so the workflow is forgiving instead of
#                    failing: if you type letters, it keeps just the digits,
#                    and if there are no digits at all it picks a date-based
#                    number automatically. A yellow warning says what it
#                    chose; the run always continues.
#
# Re-running with a version whose release already exists does not fail and
# does not create a duplicate: the existing release is edited and its APK
# assets are replaced (clobbered) with the fresh build, so an install on
# the same version simply gets the new build.
#
# One run produces both cuts of the app:
#   - the phone/tablet APKs (per-ABI splits plus universal) from
#     assembleProdRelease, and
#   - the Android TV build from assembleProdTvRelease, whose versionName
#     carries a "-TV" suffix and whose universal split is uploaded as
#     DollBloom-<version>-TV-universal.apk.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (versionName): letters + numbers allowed, e.g. 1.8 or 2.0-beta1"
        required: true
        type: string
        default: "1.8"
      version-code:
        description: "App version code: whole number, e.g. 27 (letters are auto-cleaned, run never fails on this)"
        required: true
        type: string
        default: "27"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Android · signed APK + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare version inputs (letters + numbers both OK)
        run: |
          RAW_VERSION="${{ inputs.version }}"
          RAW_CODE="${{ inputs.version-code }}"
          # versionName: anything goes — just make it safe for a git tag.
          VERSION="$(echo "$RAW_VERSION" | tr -d '[:space:]' | tr '/' '-')"
          if [ -z "$VERSION" ]; then
            VERSION="1.8"
            echo "::warning::version was empty — using default 1.8."
          fi
          # versionCode: Android requires a whole number. Letters do NOT
          # stop the run — digits are kept; with no digits at all a
          # date-based number is used. Warnings explain what happened.
          TRIMMED_CODE="$(echo "$RAW_CODE" | tr -d '[:space:]')"
          CODE="$(echo "$RAW_CODE" | tr -cd '0-9')"
          if [ "$CODE" != "$TRIMMED_CODE" ]; then
            if [ -z "$CODE" ]; then
              CODE="$(date -u +%y%m%d)"
              echo "::warning::version-code '$RAW_CODE' has no digits — Android needs a whole number, so using auto number $CODE."
            else
              echo "::warning::version-code '$RAW_CODE' is not purely numeric — Android needs a whole number, so using just its digits: $CODE."
            fi
          fi
          if [ -z "$CODE" ]; then
            CODE="$(date -u +%y%m%d)"
          fi
          echo "dollbloom_version=$VERSION" >> "$GITHUB_ENV"
          echo "dollbloom_version_code=$CODE" >> "$GITHUB_ENV"
          echo "This run builds versionName=$VERSION versionCode=$CODE"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Unlock signing key from signing/release.lock (committed; no secrets needed)
        run: bash unlock-signing.sh

      - name: Verify this is the pinned DollBloom release key
        run: |
          # Every build — today's and every future feature update — must be
          # signed with the one DollBloom release key, or an update will not
          # install over an existing install. If the key is ever swapped,
          # this fails the build instead of shipping a differently-signed APK.
          #
          # The store password is read from keystore.properties, which the
          # previous step generated from the committed signing/release.lock —
          # this workflow needs ZERO repository secrets, by design.
          if [ ! -f dollbloom-release.jks ] || [ ! -f keystore.properties ]; then
            echo "::error::Signing unlock did not produce dollbloom-release.jks / keystore.properties — cannot verify the key."
            exit 1
          fi
          STOREPASS="$(grep '^storePassword=' keystore.properties | head -1 | cut -d= -f2-)"
          if [ -z "$STOREPASS" ]; then
            echo "::error::storePassword missing from keystore.properties — cannot verify the key."
            exit 1
          fi
          EXPECTED="B2:E4:39:33:74:68:B6:50:4D:36:36:C0:0E:08:C8:BB:ED:30:7B:A2:25:D3:A9:54:E4:1D:2B:74:4F:B7:37:3B"
          ACTUAL="$(keytool -list -keystore dollbloom-release.jks -storepass "$STOREPASS" \
            | grep "SHA-256" | sed 's/.*SHA-256): //' | tr 'a-f' 'A-F')"
          echo "Keystore SHA-256: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::keytool returned no fingerprint — is signing/release.lock intact and committed?"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing key mismatch — refusing to release with a different key than shipped builds."
            exit 1
          fi
          echo "Signing key matches the pinned DollBloom release key."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed phone + Android TV release APKs
        run: |
          ./gradlew assembleProdRelease assembleProdTvRelease \
            -Pdollbloom.versionName="${{ env.dollbloom_version }}" \
            -Pdollbloom.versionCode="${{ env.dollbloom_version_code }}"

      - name: Create the release, or replace its assets if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.dollbloom_version }}"
          APK_DIR=app/build/outputs/apk/prod/release
          TV_DIR=app/build/outputs/apk/prod/tvRelease
          # Televisions get the universal split under a name that says TV:
          # one file that installs on any box, whatever its ABI.
          TV_APK="$TV_DIR/app-prod-universal-tvRelease.apk"
          TV_OUT="DollBloom-${{ env.dollbloom_version }}-TV-universal.apk"
          cp "$TV_APK" "$TV_OUT"
          ls -la "$APK_DIR" "$TV_DIR"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — editing it and replacing its APKs."
            gh release upload "$TAG" "$APK_DIR"/*.apk "$TV_OUT" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "DollBloom ${{ env.dollbloom_version }}" \
              --notes "DollBloom ${{ env.dollbloom_version }} (versionCode ${{ env.dollbloom_version_code }}) — rebuilt $(date -u +%Y-%m-%dT%H:%MZ); assets replaced on the existing release. The -TV asset is the Android TV universal build." \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "No release at $TAG yet — creating it."
            gh release create "$TAG" "$APK_DIR"/*.apk "$TV_OUT" \
              --title "DollBloom ${{ env.dollbloom_version }}" \
              --notes "DollBloom ${{ env.dollbloom_version }} (versionCode ${{ env.dollbloom_version_code }}). The -TV asset is the Android TV universal build." \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dollbloom-${{ env.dollbloom_version }}-signed
          path: |
            app/build/outputs/apk/prod/release/*.apk
            DollBloom-${{ env.dollbloom_version }}-TV-universal.apk
